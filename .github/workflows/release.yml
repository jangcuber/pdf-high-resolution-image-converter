name: Build and Release

on:
  push:
    tags:
      - "v*"
    branches:
      - claude/zen-hypatia-z5lwg9
  workflow_dispatch:
    inputs:
      version:
        description: "릴리즈 버전 태그 (예: v3.0.1)"
        required: true

permissions:
  contents: write

env:
  APP_NAME: PDF-Rasterizer
  # 태그 push면 태그 이름, 수동 실행이면 입력값, 그 외에는 기본 버전
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version || 'v3.0.0' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest
            label: macos-arm64
          - os: macos-15-intel
            label: macos-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "$env:APP_NAME" pdf_rasterizer.py
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Compress-Archive -Path "dist\$env:APP_NAME.exe" -DestinationPath "release\$env:APP_NAME-${{ matrix.label }}.zip"
          Copy-Item "dist\$env:APP_NAME.exe" "release\$env:APP_NAME-${{ matrix.label }}.exe"

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name "$APP_NAME" \
            --osx-bundle-identifier com.jangcuber.pdfrasterizer pdf_rasterizer.py
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent "dist/$APP_NAME.app" "release/$APP_NAME-${{ matrix.label }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.label }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: PDF 고해상도 이미지 변환기 ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: release/*
          body: |
            ## 다운로드

            - **Windows (64비트)**: `PDF-Rasterizer-windows-x64.exe` (또는 같은 내용의 `.zip`)
            - **macOS (Apple Silicon, M1/M2/M3/M4)**: `PDF-Rasterizer-macos-arm64.zip`
            - **macOS (Intel)**: `PDF-Rasterizer-macos-x64.zip`

            Python 설치 없이 바로 실행할 수 있습니다.

            ## 처음 실행 시 안내

            코드 서명이 되어 있지 않은 앱이라 운영체제 경고가 뜰 수 있습니다.

            - **Windows**: "Windows의 PC 보호" 창이 뜨면 `추가 정보` → `실행`을 누르세요.
            - **macOS**: zip을 풀어 `PDF-Rasterizer.app`을 응용 프로그램 폴더로 옮긴 뒤,
              앱을 **우클릭 → 열기**를 선택하세요. 그래도 열리지 않으면
              `시스템 설정 → 개인정보 보호 및 보안`에서 `그래도 열기`를 누르거나
              터미널에서 `xattr -cr /Applications/PDF-Rasterizer.app` 을 실행하세요.
